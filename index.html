<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SafetyLearn — Fire Extinguisher Battle</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Exo+2:wght@700;900&family=Orbitron:wght@700;900&display=swap');

:root {
  --bg: #ffffff; --panel: #f0f4f8; --text: #000000; --accent: #d90429;
  --correct: #28a745; --wrong: #dc3545; --gold: #f39c12; --border: #cbd5e0;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body { 
  background: var(--bg); color: var(--text); font-family: 'Exo 2', sans-serif; 
  min-height: 100vh; overflow-x: hidden; line-height: 1.2;
}

header { 
  padding: 20px 40px; background: #111; color: #fff; display: flex; 
  justify-content: space-between; align-items: center; border-bottom: 5px solid var(--accent);
}
.logo { font-family: 'Orbitron'; font-size: 2rem; letter-spacing: 2px; }
.logo span { color: var(--accent); }

.screen { display: none; padding: 40px; max-width: 1200px; margin: 0 auto; }
.screen.active { display: block; }

h1 { font-size: 3.8rem; margin-bottom: 20px; text-align: center; font-weight: 900; }
h2 { font-size: 2.5rem; margin-bottom: 20px; }
p { font-size: 1.5rem; }

.lcard { 
  background: var(--panel); border: 4px solid var(--border); border-radius: 20px; 
  padding: 40px; cursor: pointer; text-align: center; transition: 0.2s;
}
.lcard:hover { border-color: var(--accent); background: #e2e8f0; }
.lcard h3 { font-size: 2.5rem; margin-bottom: 10px; }

input { 
  width: 100%; font-size: 2rem; padding: 20px; border: 4px solid var(--border); 
  border-radius: 15px; margin: 15px 0; font-family: 'Share Tech Mono';
}

.btn { 
  font-size: 2rem; padding: 22px 40px; border-radius: 15px; border: none; 
  font-weight: 900; cursor: pointer; width: 100%; text-transform: uppercase;
}
.btn-primary { background: var(--accent); color: white; }

.q-card { 
  background: var(--panel); padding: 40px; border-radius: 30px; 
  border: 5px solid #000; margin-bottom: 30px; text-align: center;
}
#qTitle { font-size: 3rem; font-weight: 900; margin: 20px 0; }
.comp-display { display: flex; justify-content: center; align-items: center; min-height: 120px; }

.ans-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.ans-btn { 
  background: #fff; border: 5px solid var(--border); font-size: 2.2rem; 
  padding: 25px; border-radius: 20px; font-family: 'Share Tech Mono'; font-weight: 900;
  cursor: pointer;
}
.ans-btn.correct { background: var(--correct) !important; color: white !important; border-color: #1e7e34 !important; }
.ans-btn.wrong { background: var(--wrong) !important; color: white !important; border-color: #bd2130 !important; }

.lb-panel { background: #111; color: #fff; border-radius: 20px; padding: 30px; }
.lb-row { 
  display: flex; align-items: center; font-size: 2.2rem; padding: 12px; 
  border-bottom: 1px solid #333; font-family: 'Share Tech Mono';
}
.lb-rank { width: 80px; color: var(--gold); }
.lb-change { width: 100px; font-size: 1.5rem; }
.lb-name { flex: 1; }
.lb-pts { font-weight: 900; color: #00d4ff; }

.up { color: #00ff00; }
.down { color: #ff3300; }

.instructor-bar { 
  position: fixed; bottom: 0; left: 0; right: 0; padding: 20px; 
  background: #fff; border-top: 5px solid #000; display: none; justify-content: center; z-index: 500;
}

/* Extinguisher Graphic Badges */
.ext-badge {
  padding: 20px 40px; border-radius: 15px; color: white; font-weight: 900; 
  font-size: 2.5rem; border: 4px solid #000; display: inline-block;
}
.type-water { background: #d90429; }
.type-foam { background: #f4a261; color: #000; }
.type-co2 { background: #2b2d42; }
.type-powder { background: #0077b6; }
</style>
</head>
<body>

<header>
  <div class="logo">SAFETY<span>LEARN</span></div>
  <div id="roomInfo" style="font-size: 1.5rem; font-family: 'Share Tech Mono'">CLASSROOM MODE</div>
</header>

<!-- LOBBY -->
<div class="screen active" id="lobby">
  <h1>FIRE SAFETY EXAM</h1>
  <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px">
    <div class="lcard" onclick="goSolo()"><h3>🎮 SOLO</h3><p>Practice Mode</p></div>
    <div class="lcard" onclick="showScreen('setup')"><h3>📡 CLASSROOM</h3><p>Host WiFi Session</p></div>
  </div>
  <div class="lcard">
    <h2>TRAINEE JOIN</h2>
    <input id="joinName" placeholder="ENTER YOUR NAME">
    <input id="joinCode" placeholder="ROOM CODE" maxlength="6">
    <button class="btn btn-primary" onclick="joinRoom()">JOIN SESSION →</button>
  </div>
</div>

<!-- SETUP -->
<div class="screen" id="setup">
  <h1>SESSION CONFIGURATION</h1>
  <div class="lcard">
    <h2>Select Safety Drill Format:</h2>
    <div style="display:flex; gap:20px; margin: 30px 0">
      <button class="btn" style="background:#e2e8f0; color:#000" onclick="gType='pass'">PASS METHOD</button>
      <button class="btn" style="background:#e2e8f0; color:#000" onclick="gType='class'">CLASSES OF FIRE</button>
      <button class="btn" style="background:#e2e8f0; color:#000" onclick="gType='mixed'">MIXED DRILL</button>
    </div>
    <button class="btn btn-primary" onclick="createRoom()">CREATE EXAM ROOM</button>
  </div>
</div>

<!-- WAITING -->
<div class="screen" id="waiting">
  <h1 id="dispCode" style="font-size: 7rem; letter-spacing: 15px; background: #f0f0f0; padding: 20px; border-radius: 20px">------</h1>
  <div style="display: flex; justify-content: space-around; align-items: center; margin: 30px 0">
    <div id="qrWrap"></div>
    <div style="text-align: left">
      <h2 id="pCount">Trainees Joined: 0</h2>
      <div id="pList" style="font-size: 1.8rem; font-family: 'Share Tech Mono'"></div>
    </div>
  </div>
  <button class="btn btn-primary" id="startBtn" style="display:none" onclick="hostStart()">▶ BEGIN CLASS DRILL</button>
</div>

<!-- GAME -->
<div class="screen" id="game">
  <div class="q-card">
    <div id="qLabel" style="font-size: 1.8rem; color: var(--accent); text-align: left; font-weight: 900">QUESTION 1/10</div>
    <div id="compDisp" class="comp-display"></div>
    <div id="qTitle">Identify Action</div>
    <div class="ans-grid" id="ansGrid"></div>
  </div>
  <div class="lb-panel">
    <h2>LIVE RANKINGS</h2>
    <div id="lbRows"></div>
  </div>
</div>

<!-- FOOTER CONTROL -->
<div class="instructor-bar" id="instrBar">
  <button class="btn btn-primary" style="width: auto" onclick="nextQ()">NEXT QUESTION →</button>
</div>

<script>
const QUESTIONS_PASS = [
  { q: "What does 'P' stand for in the P.A.S.S. method?", a: "Pull the Pin", w: ["Press the Handle", "Point the Nozzle", "Push the Lever"] },
  { q: "What does the first 'A' stand for in P.A.S.S.?", a: "Aim Low at Base", w: ["Aim at Flames", "Activate Alarm", "Ask for Help"] },
  { q: "What does the first 'S' stand for in P.A.S.S.?", a: "Squeeze the Handle", w: ["Sweep Side to Side", "Stop and Roll", "Search for Fuel"] },
  { q: "What does the second 'S' stand for in P.A.S.S.?", a: "Sweep Side to Side", w: ["Squeeze the Handle", "Stay Low", "Shout Danger"] }
];

const QUESTIONS_CLASS = [
  { q: "Which extinguisher is used for Class A (Wood, Paper, Trash)?", a: "Water / Foam", w: ["Carbon Dioxide (CO2)", "Wet Chemical Only", "Class D Powder"], type: "type-water", code: "WATER / FOAM" },
  { q: "Which extinguisher is BEST for Class B (Flammable Liquids)?", a: "Dry Powder / CO2", w: ["Water Jet", "Wet Chemical", "Pure Oxygen"], type: "type-co2", code: "CO2 / POWDER" },
  { q: "Which extinguisher should NEVER be used on electrical fires?", a: "Water Jet", w: ["CO2 Gas", "Dry Powder", "Clean Agent"], type: "type-water", code: "WATER JET" },
  { q: "Class C fires involve which type of hazard?", a: "Flammable Gases", w: ["Cooking Oils", "Combustible Metals", "Paper/Textiles"], type: "type-powder", code: "CLASS C GAS" }
];

let peer=null, isHost=false, players={}, questions=[], current=0, answered=false, gType='pass', lastRanks={};

function showScreen(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active')); document.getElementById(id).classList.add('active'); }

function createRoom(){
  isHost=true; showScreen('waiting');
  const code = Math.random().toString(36).substring(2,8).toUpperCase();
  document.getElementById('dispCode').innerText = code;
  peer = new Peer('safe-'+code, { debug: 1, secure: true, config:{iceServers:[{urls:'stun:stun.l.google.com:19302'}]} });
  peer.on('open', ()=>{
    new QRCode(document.getElementById('qrWrap'), {text: location.href.split('#')[0]+'#'+code, width: 220, height: 220});
    document.getElementById('startBtn').style.display='block';
  });
  peer.on('connection', conn=>{
    conn.on('data', d=>{
      if(d.type==='join'){ players[conn.peer]={name:d.name,score:0,peerId:conn.peer}; updatePList(); broadcast({type:'sync', players}); }
      if(d.type==='ans'){ players[d.id].score += d.pts; renderLB(); broadcast({type:'sync', players}); }
    });
  });
}

function joinRoom(){
  const code = document.getElementById('joinCode').value || location.hash.replace('#','');
  const name = document.getElementById('joinName').value || 'Trainee';
  isHost=false; showScreen('waiting');
  peer = new Peer({ debug: 1, secure: true });
  peer.on('open', ()=>{
    const conn = peer.connect('safe-'+code, {reliable:true});
    conn.on('open', ()=> conn.send({type:'join', name: name}));
    conn.on('data', d=>{
      if(d.type==='sync'){ players=d.players; renderLB(); }
      if(d.type==='start'){ questions=d.qs; current=0; showScreen('game'); renderNextQ(); }
      if(d.type==='next'){ current=d.cur; renderNextQ(); }
    });
  });
}

function hostStart(){
  let bank = gType==='pass' ? QUESTIONS_PASS : QUESTIONS_CLASS;
  questions = [];
  for(let i=0; i<10; i++) questions.push(bank[Math.floor(Math.random()*bank.length)]);
  broadcast({type:'start', qs: questions});
  document.getElementById('instrBar').style.display='flex';
  showScreen('game'); renderNextQ();
}

function renderNextQ(){
  answered=false; const q=questions[current];
  document.getElementById('qLabel').innerText = `DRILL QUESTION ${current+1}/10`;
  document.getElementById('qTitle').innerText = q.q;
  
  const cd=document.getElementById('compDisp'), aa=document.getElementById('ansGrid');
  aa.innerHTML='';
  
  if(q.type) {
    cd.innerHTML = `<div class="ext-badge ${q.type}">${q.code}</div>`;
  } else {
    cd.innerHTML = `<div class="ext-badge type-co2">SAFETY DRILL</div>`;
  }

  let opts = [q.a, ...q.w].sort(()=>Math.random()-.5);
  opts.forEach(o=>{
    const b=document.createElement('button'); b.className='ans-btn'; b.innerText=o;
    b.onclick=()=>{ 
      if(!answered && !isHost){ 
        answered=true; 
        if(o===q.a){
          b.classList.add('correct'); 
          peer.connections[Object.keys(peer.connections)[0]][0].send({type:'ans', pts:10, id:peer.id});
        } else {
          b.classList.add('wrong'); 
        }
        document.querySelectorAll('.ans-btn').forEach(btn=>btn.disabled=true); 
      }
    };
    aa.appendChild(b);
  });
}

function nextQ(){
  current++;
  if(current < 10){ broadcast({type:'next', cur:current}); renderNextQ(); }
  else alert("Exam Completed!");
}

function renderLB(){
  const sorted = Object.values(players).sort((a,b)=>b.score-a.score);
  document.getElementById('lbRows').innerHTML = sorted.map((p,i)=>{
    const rank = i+1;
    let change = '';
    if(lastRanks[p.peerId]){
      const diff = lastRanks[p.peerId] - rank;
      if(diff > 0) change = `<span class="up">▲${diff}</span>`;
      else if(diff < 0) change = `<span class="down">▼${Math.abs(diff)}</span>`;
    }
    lastRanks[p.peerId] = rank;
    return `<div class="lb-row"><span class="lb-rank">#${rank}</span><span class="lb-change">${change}</span><span class="lb-name">${p.name.toUpperCase()}</span><span class="lb-pts">${p.score} PTS</span></div>`;
  }).join('');
}

function updatePList(){ 
  document.getElementById('pCount').innerText = `Trainees Joined: ${Object.keys(players).length}`; 
  document.getElementById('pList').innerText = Object.values(players).map(p=>p.name).join(', ');
}
function broadcast(m){ Object.values(peer.connections).forEach(conns=>conns[0].send(m)); }
function goSolo(){ startSolo(); }
function startSolo(){ hostStart(); }
window.onload = () => { if(window.location.hash) document.getElementById('joinCode').value = window.location.hash.replace('#',''); };
</script>
</body>
</html>
